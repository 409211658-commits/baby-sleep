<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>宝宝睡眠记录</title>
<style>
  :root {
    --bg: #F5F7FA;
    --card: #fff;
    --text: #333;
    --label: #888;
    --primary: #4A90E2;
    --danger: #E25A5A;
    --success-bg: #E8F5E9;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 16px;
  }
  body.dark {
    --bg: #1a1a1a;
    --card: #2a2a2a;
    --text: #eee;
    --label: #aaa;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --success-bg: #1e3a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
    transition: background 0.3s;
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    font-size: 16px;
  }
  .header {
    padding: 16px;
    background: var(--card);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    border-radius: 0 0 var(--radius) var(--radius);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .date-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .date-nav button { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--primary); padding: 4px 8px; border-radius: 6px; }
  .date-nav span { font-weight: 600; font-size: 18px; }
  .wake-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .wake-row label { font-size: 16px; color: var(--label); }
  .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 500; }
  .btn.outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: var(--card);
    padding: 14px 10px;
    border-radius: var(--radius);
    margin: 0 12px 14px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .stat-item .stat-label { font-size: 13px; color: var(--label); margin-bottom: 4px; }
  .stat-item .stat-value { font-weight: 700; font-size: 17px; }
  .container { padding: 0 12px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    margin-bottom: 16px;
    position: relative;
  }
  .card.night-card { border-left: 4px solid #3F51B5; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-title { font-weight: 700; font-size: 18px; }
  .delete-btn { background: none; border: none; color: var(--danger); font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .field-row { display: flex; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
  .field-label { width: 68px; font-size: 15px; color: var(--label); flex-shrink: 0; }
  .calc-value {
    font-size: 15px;
    color: #2E7D32;
    background: var(--success-bg);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    cursor: pointer;
  }
  .calc-value.editable { text-decoration: underline dotted; }
  .time-btn {
    background: var(--bg);
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .time-btn:active { opacity: 0.7; }
  .nap-sleep-note {
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    flex: 1;
    min-width: 50px;
    font-family: inherit;
  }
  select.field-input {
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    max-width: 130px;
  }
  .field-input[type="text"] {
    flex: 1;
    min-width: 70px;
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: var(--bg);
    color: var(--text);
  }
  .add-nap-btn {
    width: 100%;
    padding: 16px;
    background: var(--card);
    border: 2px dashed #ccc;
    border-radius: var(--radius);
    font-size: 18px;
    color: var(--primary);
    cursor: pointer;
    margin-bottom: 18px;
    font-weight: 600;
    box-shadow: var(--shadow);
  }
  .night-label { background: #3F51B5; color: white; padding: 2px 8px; border-radius: 12px; font-size: 14px; margin-left: 6px; }
  .mode-toggle { position: fixed; top: 10px; right: 10px; background: var(--card); border: none; font-size: 24px; cursor: pointer; z-index: 11; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  .bottom-tools {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 12px;
  }

  .nowrap-row { flex-wrap: nowrap !important; }
  .nowrap-row .time-btn { padding: 6px 8px; font-size: 14px; }
  .nowrap-row .calc-value { font-size: 14px; padding: 2px 6px; }
  .nowrap-row span { font-size: 14px; white-space: nowrap; }

  .picker-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 200;
  }
  .picker-container {
    background: var(--card); border-radius: 24px; padding: 24px; width: 90%; max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .picker-header { display: flex; justify-content: space-between; margin-bottom: 14px; }
  .picker-header button { background: none; border: none; color: var(--primary); font-size: 18px; cursor: pointer; font-family: inherit; }
  .picker-wheels {
    display: flex; justify-content: center; gap: 12px; height: 200px; position: relative;
    margin-bottom: 12px;
  }
  .wheel-mask {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    background: linear-gradient(to bottom, var(--card) 0%, transparent 30%, transparent 70%, var(--card) 100%);
    z-index: 2;
  }
  .wheel {
    width: 90px; overflow-y: auto; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch; border-radius: 14px;
    background: transparent;
    position: relative; z-index: 1;
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel-highlight {
    position: absolute; top: 50%; left: 0; right: 0; height: 44px; transform: translateY(-50%);
    background: rgba(74,144,226,0.2); border-radius: 12px; pointer-events: none; z-index: 0;
    margin: 0 4px;
  }
  .wheel-item {
    height: 44px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--label); scroll-snap-align: center;
    user-select: none; cursor: pointer;
    position: relative; z-index: 1;
  }
  .picker-preview { text-align: center; font-size: 16px; color: var(--label); min-height: 24px; margin-top: 8px; }

  @media (max-width: 400px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .field-label { width: 60px; }
    .time-btn { padding: 5px 6px; font-size: 14px; }
    .nowrap-row .time-btn { padding: 5px 6px; }
    .calc-value { font-size: 13px; padding: 2px 5px; }
  }
</style>
</head>
<body>
<button class="mode-toggle" onclick="toggleDark()" title="深色模式">🌓</button>

<div class="header">
  <div class="date-row">
    <div class="date-nav">
      <button onclick="changeDate(-1)">◀</button>
      <span id="dateDisplay">2026-06-13</span>
      <button onclick="changeDate(1)">▶</button>
    </div>
    <div id="todayIndicator" style="font-size:13px;color:var(--primary)"></div>
  </div>
  <div class="wake-row">
    <label>起床时间:</label>
    <button class="time-btn" id="wakeTimeBtn" onclick="openWakeTimePicker()">07:00</button>
    <button class="btn outline" onclick="copyYesterday()">复制昨日</button>
  </div>
</div>

<div class="stats">
  <div class="stat-item"><div class="stat-label">已清醒</div><div class="stat-value" id="statAwake">--</div></div>
  <div class="stat-item"><div class="stat-label">白天睡眠</div><div class="stat-value" id="statDaySleep">--</div></div>
  <div class="stat-item"><div class="stat-label">夜间睡眠</div><div class="stat-value" id="statNightSleep">--</div></div>
  <div class="stat-item"><div class="stat-label">总睡眠</div><div class="stat-value" id="statTotalSleep">--</div></div>
</div>

<div class="container" id="napsContainer"></div>

<button class="add-nap-btn" onclick="addNap()">+ 添加小觉</button>

<div id="nightCardContainer" class="container"></div>

<div class="bottom-tools">
  <button class="btn outline" onclick="exportData()">导出数据</button>
  <button class="btn outline" onclick="importData()">导入数据</button>
</div>

<!-- 时间选择器 -->
<div id="timePickerOverlay" class="picker-overlay" style="display:none;">
  <div class="picker-container">
    <div class="picker-header">
      <button onclick="cancelPicker()">取消</button>
      <span style="font-weight:600;font-size:18px;">选择时间</span>
      <button onclick="confirmPicker()">确定</button>
    </div>
    <div class="picker-wheels" id="pickerWheels">
      <div class="wheel-mask"></div>
      <div class="wheel-highlight"></div>
      <div class="wheel" id="hourWheel"></div>
      <div class="wheel" id="minuteWheel"></div>
    </div>
    <div class="picker-preview" id="pickerPreview"></div>
  </div>
</div>

<!-- 时长选择器 -->
<div id="durationPickerOverlay" class="picker-overlay" style="display:none;">
  <div class="picker-container">
    <div class="picker-header">
      <button onclick="cancelDurationPicker()">取消</button>
      <span style="font-weight:600;font-size:18px;">选择时长</span>
      <button onclick="confirmDurationPicker()">确定</button>
    </div>
    <div class="picker-wheels" id="durationWheels">
      <div class="wheel-mask"></div>
      <div class="wheel-highlight"></div>
      <div class="wheel" id="durHourWheel"></div>
      <div class="wheel" id="durMinuteWheel"></div>
    </div>
    <div class="picker-preview" id="durationPreview"></div>
  </div>
</div>

<script>
// ==================== 数据库 ====================
const DB_NAME = 'BabySleepDB8', STORE_NAME = 'records';
let db, currentDate = getTodayLocal(), currentData = null;
let scrollPosition = 0;

function getLocalDateString(date) {
  const d = date instanceof Date ? date : new Date(date + 'T00:00:00');
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function getTodayLocal() { return getLocalDateString(new Date()); }
function shiftDate(dateStr, delta) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return getLocalDateString(d);
}

function openDB() {
  return new Promise((resolve, reject) => {
    let req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => { e.target.result.createObjectStore(STORE_NAME, { keyPath: 'date' }); };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror = reject;
  });
}
async function loadRecord(date) {
  return new Promise(resolve => {
    let tx = db.transaction(STORE_NAME,'readonly');
    let r = tx.objectStore(STORE_NAME).get(date);
    r.onsuccess = () => resolve(r.result||null);
    r.onerror = () => resolve(null);
  });
}
async function saveRecord(record) {
  return new Promise(resolve => {
    let tx = db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(record);
    tx.oncomplete = resolve;
  });
}
function createEmptyRecord(date) {
  return { date, wake_up_time:'07:00', naps:[], night:{ bed_time:'19:30',asleep_time:'19:40',wake_time:'07:15',sleep_method:'自主',wake_method:'自己醒',note:'' } };
}

const toMin = t => { if(!t) return NaN; let [h,m]=t.split(':').map(Number); return h*60+m; };
const toTime = min => { min=((min%1440)+1440)%1440; return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`; };
const duration = (s,e) => { if(!s||!e) return null; let sm=toMin(s),em=toMin(e); if(em<=sm) em+=1440; return em-sm; };
const fmtDur = m => m===null||isNaN(m)?'--':`${Math.floor(m/60)}h${m%60}m`;
const fmtDurShort = m => m===null||isNaN(m)?'--':`${Math.floor(m/60)}h${m%60}m`;
const fmtMinOnly = m => m===null||isNaN(m)?'--':`${m}分钟`;

// 传播计划间隔，自动计算入睡和放床时间
function propagate(rec) {
  let naps = rec.naps;
  for (let i = 0; i < naps.length; i++) {
    const nap = naps[i];
    if (nap.planned_wake_window !== undefined && nap.planned_wake_window !== null) {
      const base = i === 0 ? rec.wake_up_time : naps[i-1].wake_time;
      if (base && base !== '--:--') {
        const newAsleep = toTime(toMin(base) + nap.planned_wake_window);
        nap.asleep_time = newAsleep;
        nap.bed_time = toTime(toMin(newAsleep) - 10);
      }
    }
  }
  if (rec.night.planned_wake_window !== undefined && rec.night.planned_wake_window !== null) {
    const base = naps.length ? naps[naps.length-1].wake_time : rec.wake_up_time;
    if (base && base !== '--:--') {
      const newAsleep = toTime(toMin(base) + rec.night.planned_wake_window);
      rec.night.asleep_time = newAsleep;
      rec.night.bed_time = toTime(toMin(newAsleep) - 10);
    }
  }
}

function computeAll(rec) {
  let naps = rec.naps, wake = rec.wake_up_time, night = rec.night;
  naps.forEach((nap,i)=>{
    nap.sleep_duration = duration(nap.asleep_time, nap.wake_time);
    nap.wake_window = i===0 ? duration(wake, nap.asleep_time) : duration(naps[i-1].wake_time, nap.asleep_time);
  });
  night.sleep_duration = duration(night.asleep_time, night.wake_time);
  night.before_night_window = naps.length ? duration(naps[naps.length-1].wake_time, night.asleep_time) : duration(wake, night.asleep_time);
}

function computeStats(rec) {
  let dayTotal=0; rec.naps.forEach(n=>{ if(n.sleep_duration) dayTotal+=n.sleep_duration; });
  let nightTotal = rec.night.sleep_duration || 0;
  let total = dayTotal+nightTotal;
  let awakeDur = null;
  if(rec.date === getTodayLocal()) {
    let now = new Date().getHours()*60 + new Date().getMinutes();
    let wakeMin = toMin(rec.wake_up_time);
    if(wakeMin!==undefined) {
      let awake = now - wakeMin; if(awake<0) awake+=1440;
      let completed = 0;
      rec.naps.forEach(n=>{ if(n.sleep_duration) completed+=n.sleep_duration; });
      let lastNap = rec.naps[rec.naps.length-1];
      if(lastNap && lastNap.asleep_time && !lastNap.wake_time) completed += (now - toMin(lastNap.asleep_time));
      if(rec.night.asleep_time && !rec.night.wake_time) completed += (now - toMin(rec.night.asleep_time));
      awake -= completed; if(awake<0) awake=0;
      awakeDur = awake;
    }
  } else {
    let sum=0; rec.naps.forEach(n=>{ if(n.wake_window) sum+=n.wake_window; });
    if(rec.night.before_night_window) sum+=rec.night.before_night_window;
    awakeDur = sum;
  }
  return { awakeDur, dayTotal, nightTotal, total };
}

// ==================== 渲染 ====================
function renderAll() {
  computeAll(currentData);
  let stats = computeStats(currentData);
  document.getElementById('statAwake').textContent = stats.awakeDur!==null?fmtDurShort(stats.awakeDur):'--';
  document.getElementById('statDaySleep').textContent = fmtDurShort(stats.dayTotal);
  document.getElementById('statNightSleep').textContent = fmtDurShort(stats.nightTotal);
  document.getElementById('statTotalSleep').textContent = fmtDurShort(stats.total);
  document.getElementById('wakeTimeBtn').textContent = currentData.wake_up_time;
  document.getElementById('dateDisplay').textContent = currentData.date;
  document.getElementById('todayIndicator').textContent = currentData.date===getTodayLocal()?'今天':'';
  renderNaps();
  renderNight();
}

function renderNaps() {
  let container = document.getElementById('napsContainer');
  container.innerHTML = '';
  currentData.naps.forEach((nap,idx)=>{
    let card = document.createElement('div'); card.className='card';
    let wakeWin = nap.wake_window;
    let sleepDur = nap.sleep_duration;
    let bedTime = nap.bed_time || '--:--';
    let asleepTime = nap.asleep_time || '--:--';
    let wakeTime = nap.wake_time || '--:--';
    let sleepNote = nap.sleep_note || '';
    let betweenMin = (bedTime!=='--:--' && asleepTime!=='--:--') ? duration(bedTime, asleepTime) : null;
    card.innerHTML = `
      <div class="card-header"><span class="card-title">第${idx+1}觉</span><button class="delete-btn" data-idx="${idx}">🗑️</button></div>
      <div class="field-row"><span class="field-label">清醒间隔:</span><span class="calc-value editable" data-idx="${idx}" data-action="editWindow">${wakeWin?fmtDur(wakeWin):'--'}</span></div>
      <div class="field-row nowrap-row">
        <span class="field-label" style="flex-shrink:0;">入睡时间:</span>
        <button class="time-btn" data-idx="${idx}" data-action="asleep">${asleepTime}</button>
        <span style="margin:0 2px;">(</span>
        <button class="time-btn" data-idx="${idx}" data-action="bed">${bedTime}</button>
        <span style="margin:0 2px;">放</span>
        <span class="calc-value">${betweenMin!==null?fmtMinOnly(betweenMin):'--'}</span>
        <span style="margin:0 2px;">入睡)</span>
      </div>
      <div class="field-row">
        <span class="field-label">结束时间:</span>
        <button class="time-btn" data-idx="${idx}" data-action="wake">${wakeTime}</button>
        <input class="nap-sleep-note" placeholder="状态" value="${sleepNote}" data-idx="${idx}" data-action="sleepNote" style="margin-left:6px;">
      </div>
      <div class="field-row"><span class="field-label">睡眠时长:</span><span class="calc-value editable" data-idx="${idx}" data-action="editDuration">${sleepDur?fmtDur(sleepDur):'--'}</span></div>
      <div class="field-row"><span class="field-label">入睡方式:</span><select class="field-input" data-idx="${idx}" data-action="sleepMethod">${['自主','抱哄','奶睡','其他'].map(o=>`<option ${nap.sleep_method===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field-row"><span class="field-label">醒来方式:</span><select class="field-input" data-idx="${idx}" data-action="wakeMethod">${['自己醒','叫醒','哭醒','其他'].map(o=>`<option ${nap.wake_method===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field-row"><span class="field-label">备注:</span><input class="field-input" type="text" value="${nap.note||''}" data-idx="${idx}" data-action="note" placeholder="备注"></div>
    `;
    container.appendChild(card);
  });
  bindCardEvents();
}

function renderNight() {
  let container = document.getElementById('nightCardContainer');
  let night = currentData.night;
  let betweenMin = (night.bed_time && night.asleep_time) ? duration(night.bed_time, night.asleep_time) : null;
  container.innerHTML = `
    <div class="card night-card">
      <div class="card-header"><span class="card-title">🌙夜觉</span><span class="night-label">夜间</span></div>
      <div class="field-row"><span class="field-label">清醒间隔:</span><span class="calc-value editable" data-action="editNightWindow">${night.before_night_window?fmtDur(night.before_night_window):'--'}</span></div>
      <div class="field-row nowrap-row">
        <span class="field-label">入睡时间:</span>
        <button class="time-btn" data-action="nightAsleep">${night.asleep_time||'--:--'}</button>
        <span>(</span>
        <button class="time-btn" data-action="nightBed">${night.bed_time||'--:--'}</button>
        <span>放</span>
        <span class="calc-value">${betweenMin!==null?fmtMinOnly(betweenMin):'--'}</span>
        <span>入睡)</span>
      </div>
      <div class="field-row">
        <span class="field-label">结束时间:</span>
        <button class="time-btn" data-action="nightWake">${night.wake_time||'--:--'}</button>
        <input class="nap-sleep-note" placeholder="状态" value="${night.sleep_note||''}" data-action="nightSleepNote">
      </div>
      <div class="field-row"><span class="field-label">睡眠时长:</span><span class="calc-value editable" data-action="editNightDuration">${night.sleep_duration?fmtDur(night.sleep_duration):'--'}</span></div>
      <div class="field-row"><span class="field-label">入睡方式:</span><select class="field-input" data-action="nightSleepMethod">${['自主','抱哄','奶睡','其他'].map(o=>`<option ${night.sleep_method===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field-row"><span class="field-label">醒来方式:</span><select class="field-input" data-action="nightWakeMethod">${['自己醒','叫醒','哭醒','其他'].map(o=>`<option ${night.wake_method===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field-row"><span class="field-label">备注:</span><input class="field-input" type="text" value="${night.note||''}" data-action="nightNote" placeholder="备注"></div>
    </div>
  `;
  bindNightEvents();
}

function bindCardEvents() {
  document.querySelectorAll('[data-idx][data-action="bed"]').forEach(b=> b.onclick = ()=> openTimePicker('napBed', +b.dataset.idx));
  document.querySelectorAll('[data-idx][data-action="asleep"]').forEach(b=> b.onclick = ()=> openTimePicker('napAsleep', +b.dataset.idx));
  document.querySelectorAll('[data-idx][data-action="wake"]').forEach(b=> b.onclick = ()=> openTimePicker('napWake', +b.dataset.idx));
  document.querySelectorAll('[data-idx][data-action="editWindow"]').forEach(s=> s.onclick = ()=> editWakeWindow(+s.dataset.idx));
  document.querySelectorAll('[data-idx][data-action="editDuration"]').forEach(s=> s.onclick = ()=> editSleepDuration(+s.dataset.idx));
  document.querySelectorAll('[data-idx][data-action="sleepMethod"]').forEach(s=> s.onchange = e => { currentData.naps[+s.dataset.idx].sleep_method=e.target.value; saveAndRender(); });
  document.querySelectorAll('[data-idx][data-action="wakeMethod"]').forEach(s=> s.onchange = e => { currentData.naps[+s.dataset.idx].wake_method=e.target.value; saveAndRender(); });
  document.querySelectorAll('[data-idx][data-action="note"]').forEach(i=> i.onchange = e => { currentData.naps[+i.dataset.idx].note=e.target.value; saveAndRender(); });
  document.querySelectorAll('[data-idx][data-action="sleepNote"]').forEach(i=> i.onchange = e => { currentData.naps[+i.dataset.idx].sleep_note=e.target.value; saveAndRender(); });
  document.querySelectorAll('.delete-btn').forEach(b=> b.onclick = ()=> deleteNap(+b.dataset.idx));
}

function bindNightEvents() {
  document.querySelector('[data-action="nightBed"]').onclick = ()=> openTimePicker('nightBed');
  document.querySelector('[data-action="nightAsleep"]').onclick = ()=> openTimePicker('nightAsleep');
  document.querySelector('[data-action="nightWake"]').onclick = ()=> openTimePicker('nightWake');
  document.querySelector('[data-action="nightSleepMethod"]').onchange = e => { currentData.night.sleep_method=e.target.value; saveAndRender(); };
  document.querySelector('[data-action="nightWakeMethod"]').onchange = e => { currentData.night.wake_method=e.target.value; saveAndRender(); };
  document.querySelector('[data-action="nightNote"]').onchange = e => { currentData.night.note=e.target.value; saveAndRender(); };
  document.querySelector('[data-action="nightSleepNote"]').onchange = e => { currentData.night.sleep_note=e.target.value; saveAndRender(); };
  document.querySelector('[data-action="editNightWindow"]').onclick = editNightWindow;
  document.querySelector('[data-action="editNightDuration"]').onclick = editNightDuration;
}

// ==================== 时长选择器 ====================
let durationCallback = null;

function showDurationPicker(currentMinutes, callback) {
  durationCallback = callback;
  const overlay = document.getElementById('durationPickerOverlay');
  overlay.style.display = 'flex';
  const h = Math.floor(currentMinutes / 60);
  const m = currentMinutes % 60;
  buildLoopWheel('durHourWheel', 0, 12, h);
  buildLoopWheel('durMinuteWheel', 0, 59, m, 1);
  document.getElementById('durationPreview').textContent = '';
}

function cancelDurationPicker() {
  document.getElementById('durationPickerOverlay').style.display = 'none';
  durationCallback = null;
}

function confirmDurationPicker() {
  const hWheel = document.getElementById('durHourWheel');
  const mWheel = document.getElementById('durMinuteWheel');
  const getVal = (wheel) => {
    let center = wheel.scrollTop + wheel.clientHeight/2;
    let best = null, minDist = Infinity;
    [...wheel.children].forEach(el => {
      let elCenter = el.offsetTop + el.offsetHeight/2;
      let dist = Math.abs(center - elCenter);
      if(dist < minDist) { minDist = dist; best = el; }
    });
    return best ? parseInt(best.dataset.value) : 0;
  };
  const hours = getVal(hWheel);
  const minutes = getVal(mWheel);
  const total = hours * 60 + minutes;
  if (durationCallback) durationCallback(total);
  cancelDurationPicker();
}

function editWakeWindow(idx) {
  const nap = currentData.naps[idx];
  const cur = nap.wake_window || nap.planned_wake_window || 90;
  showDurationPicker(cur, (min) => {
    let base = idx===0 ? currentData.wake_up_time : currentData.naps[idx-1].wake_time;
    if(!base) return alert('缺少基准时间');
    nap.asleep_time = toTime(toMin(base) + min);
    nap.bed_time = toTime(toMin(base) + min - 10);
    nap.planned_wake_window = min;
    propagate(currentData);
    saveAndRender();
  });
}

function editNightWindow() {
  const night = currentData.night;
  const cur = night.before_night_window || night.planned_wake_window || 120;
  showDurationPicker(cur, (min) => {
    let base = currentData.naps.length ? currentData.naps[currentData.naps.length-1].wake_time : currentData.wake_up_time;
    if(!base) return alert('缺少基准时间');
    night.asleep_time = toTime(toMin(base) + min);
    night.bed_time = toTime(toMin(base) + min - 10);
    night.planned_wake_window = min;
    propagate(currentData);
    saveAndRender();
  });
}

function editSleepDuration(idx) {
  const nap = currentData.naps[idx];
  if (!nap.asleep_time) return alert('请先填写入睡时间');
  const cur = nap.sleep_duration || 60;
  showDurationPicker(cur, (min) => {
    nap.wake_time = toTime(toMin(nap.asleep_time) + min);
    propagate(currentData);
    saveAndRender();
  });
}

function editNightDuration() {
  const night = currentData.night;
  if (!night.asleep_time) return alert('请先填写夜觉入睡时间');
  const cur = night.sleep_duration || 600;
  showDurationPicker(cur, (min) => {
    night.wake_time = toTime(toMin(night.asleep_time) + min);
    propagate(currentData);
    saveAndRender();
  });
}

// ==================== 时间点选择器 ====================
let currentPicker = null;
function openTimePicker(type, napIdx) {
  let def;
  if(type.startsWith('nap')) {
    let nap = currentData.naps[napIdx];
    if(type==='napBed') def = nap.bed_time;
    else if(type==='napAsleep') def = nap.asleep_time;
    else def = nap.wake_time;
  } else if(type.startsWith('night')) {
    if(type==='nightBed') def = currentData.night.bed_time;
    else if(type==='nightAsleep') def = currentData.night.asleep_time;
    else def = currentData.night.wake_time;
  } else if(type==='wake') def = currentData.wake_up_time;
  if(!def || def==='--:--') {
    let now = new Date();
    def = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  }
  currentPicker = { type, napIdx, def, onChange: val => {
    if(type==='wake') {
      currentData.wake_up_time = val;
      propagate(currentData);
    } else if(type.startsWith('nap')) {
      let nap = currentData.naps[napIdx];
      if(type==='napBed') {
        nap.bed_time = val;
        delete nap.planned_wake_window;
      } else if(type==='napAsleep') {
        nap.asleep_time = val;
        // 自动设置放床时间为入睡时间-10分钟
        nap.bed_time = toTime(toMin(val) - 10);
        delete nap.planned_wake_window;
      } else if(type==='napWake') {
        nap.wake_time = val;
      }
    } else if(type.startsWith('night')) {
      if(type==='nightBed') {
        currentData.night.bed_time = val;
        delete currentData.night.planned_wake_window;
      } else if(type==='nightAsleep') {
        currentData.night.asleep_time = val;
        currentData.night.bed_time = toTime(toMin(val) - 10);
        delete currentData.night.planned_wake_window;
      } else if(type==='nightWake') {
        currentData.night.wake_time = val;
      }
    }
    propagate(currentData);
    saveAndRender();
  }};
  showPicker(def);
}

function showPicker(initial) {
  let overlay = document.getElementById('timePickerOverlay');
  overlay.style.display = 'flex';
  let [h,m] = initial.split(':').map(Number);
  buildLoopWheel('hourWheel', 0, 23, h);
  buildLoopWheel('minuteWheel', 0, 59, m, 1);
  updatePickerPreview();
}

function buildLoopWheel(id, min, max, selected, step=1) {
  let wheel = document.getElementById(id);
  wheel.innerHTML = '';
  const data = [];
  for(let r=0; r<3; r++) {
    for(let i=min; i<=max; i+=step) data.push(i);
  }
  const middleStart = data.length/3;
  data.forEach((val, idx)=>{
    let div = document.createElement('div');
    div.className = 'wheel-item';
    div.textContent = String(val).padStart(2,'0');
    div.dataset.value = val;
    wheel.appendChild(div);
  });
  let targetIdx = middleStart + (selected - min) / step;
  let targetItem = wheel.children[targetIdx];
  if(targetItem) {
    wheel.scrollTop = targetItem.offsetTop - wheel.clientHeight/2 + targetItem.offsetHeight/2;
  }
  wheel.onscroll = () => {
    let center = wheel.scrollTop + wheel.clientHeight/2;
    let best = null, minDist = Infinity;
    [...wheel.children].forEach(el => {
      let elCenter = el.offsetTop + el.offsetHeight/2;
      let dist = Math.abs(center - elCenter);
      if(dist < minDist) { minDist = dist; best = el; }
    });
    if(best) {
      [...wheel.children].forEach(el => { el.style.color = 'var(--label)'; el.style.fontWeight = '400'; });
      best.style.color = 'var(--text)';
      best.style.fontWeight = '600';
    }
    updatePickerPreview();
  };
}

function getPickerValue() {
  let hWheel = document.getElementById('hourWheel');
  let mWheel = document.getElementById('minuteWheel');
  let getCenterVal = (wheel) => {
    let center = wheel.scrollTop + wheel.clientHeight/2;
    let best = null, minDist = Infinity;
    [...wheel.children].forEach(el => {
      let elCenter = el.offsetTop + el.offsetHeight/2;
      let dist = Math.abs(center - elCenter);
      if(dist < minDist) { minDist = dist; best = el; }
    });
    return best ? best.dataset.value : null;
  };
  let h = getCenterVal(hWheel);
  let m = getCenterVal(mWheel);
  if(!h || !m) return null;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function updatePickerPreview() {
  let val = getPickerValue();
  if(!val || !currentPicker) return;
  let preview = document.getElementById('pickerPreview');
  let type = currentPicker.type, idx = currentPicker.napIdx;
  if(type==='napBed' || type==='nightBed') {
    let asleep = type==='napBed' ? currentData.naps[idx].asleep_time : currentData.night.asleep_time;
    if(asleep) preview.textContent = `入睡耗时 ${duration(val, asleep)}分钟`;
    else preview.textContent = '(缺入睡时间)';
  } else if(type==='napAsleep') {
    let prev = idx===0 ? currentData.wake_up_time : currentData.naps[idx-1].wake_time;
    if(prev) {
      let winMin = duration(prev, val);
      preview.textContent = winMin ? `清醒间隔 ${fmtDur(winMin)}` : '';
    } else preview.textContent = '';
  } else if(type==='nightAsleep') {
    let last = currentData.naps.length ? currentData.naps[currentData.naps.length-1].wake_time : currentData.wake_up_time;
    if(last) {
      let winMin = duration(last, val);
      preview.textContent = winMin ? `清醒间隔 ${fmtDur(winMin)}` : '';
    } else preview.textContent = '';
  } else preview.textContent = '';
}

function confirmPicker() {
  let val = getPickerValue();
  if(val && currentPicker) currentPicker.onChange(val);
  cancelPicker();
}
function cancelPicker() {
  document.getElementById('timePickerOverlay').style.display = 'none';
  currentPicker = null;
}
function openWakeTimePicker() { openTimePicker('wake'); }

function addNap() {
  currentData.naps.push({ bed_time:'', asleep_time:'', wake_time:'', sleep_method:'自主', wake_method:'自己醒', note:'', sleep_note:'' });
  saveAndRender();
}
function deleteNap(idx) {
  if(!confirm('删除第'+(idx+1)+'觉？')) return;
  currentData.naps.splice(idx,1);
  propagate(currentData);
  saveAndRender();
}
function saveAndRender() {
  computeAll(currentData);
  saveRecord(currentData);
  renderAll();
}

async function changeDate(delta) {
  scrollPosition = window.scrollY;
  currentDate = shiftDate(currentDate, delta);
  await loadCurrentDate();
}
async function loadCurrentDate() {
  let rec = await loadRecord(currentDate);
  if(!rec) {
    let prev = await loadRecord(shiftDate(currentDate, -1));
    rec = createEmptyRecord(currentDate);
    if(prev && prev.naps.length) {
      rec.naps = prev.naps.map(()=>({ bed_time:'',asleep_time:'',wake_time:'',sleep_method:'',wake_method:'',note:'',sleep_note:'' }));
    }
    await saveRecord(rec);
  }
  currentData = rec;
  propagate(currentData);
  renderAll();
  requestAnimationFrame(() => { window.scrollTo(0, scrollPosition); });
}
// 复制昨日：只复制清醒间隔、入睡方式等，不复制具体时间，以便根据今日起床时间重新计算
async function copyYesterday() {
  let yesterday = shiftDate(currentDate, -1);
  let rec = await loadRecord(yesterday);
  if(!rec) return alert('昨天无数据');
  if(!confirm(`复制昨天 (${yesterday}) 的所有记录到今天？今日数据将被覆盖。`)) return;
  let copy = JSON.parse(JSON.stringify(rec));
  copy.date = currentDate;
  // 清除备注
  copy.naps.forEach(n => { n.note = ''; n.sleep_note = ''; });
  copy.night.note = ''; copy.night.sleep_note = '';
  // 提取昨天的清醒间隔作为计划间隔，同时清除具体时间点
  copy.naps.forEach((nap, i) => {
    nap.planned_wake_window = nap.wake_window || null;
    nap.bed_time = '';
    nap.asleep_time = '';
    nap.wake_time = '';
    delete nap.sleep_duration;
  });
  copy.night.planned_wake_window = copy.night.before_night_window || null;
  copy.night.bed_time = '';
  copy.night.asleep_time = '';
  copy.night.wake_time = '';
  delete copy.night.sleep_duration;
  // 起床时间保留昨天的，但用户可以修改，修改后会触发propagate
  currentData = copy;
  propagate(currentData);
  await saveRecord(currentData);
  renderAll();
}

function exportData() {
  let tx = db.transaction(STORE_NAME,'readonly');
  let all = tx.objectStore(STORE_NAME).getAll();
  all.onsuccess = ()=>{
    let json = JSON.stringify(all.result,null,2);
    let blob = new Blob([json],{type:'application/json'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `宝宝睡眠备份_${getTodayLocal()}.json`;
    a.click();
  };
}
function importData() {
  let inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = async e=>{
    let file = e.target.files[0]; if(!file) return;
    let text = await file.text();
    let records; try{ records=JSON.parse(text); }catch{ return alert('格式错误'); }
    let tx = db.transaction(STORE_NAME,'readwrite');
    let store = tx.objectStore(STORE_NAME);
    records.forEach(r=>store.put(r));
    tx.oncomplete = ()=>{ loadCurrentDate(); alert('导入成功'); };
  };
  inp.click();
}

function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', document.body.classList.contains('dark'));
}
setInterval(()=>{
  if(currentData && currentData.date===getTodayLocal()) {
    let stats = computeStats(currentData);
    document.getElementById('statAwake').textContent = stats.awakeDur!==null?fmtDurShort(stats.awakeDur):'--';
  }
},30000);

(async ()=>{
  await openDB();
  if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark');
  await loadCurrentDate();
})();
