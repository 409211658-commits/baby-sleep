<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宝宝睡眠记录</title>
<style>
  :root {
    --bg: #F5F7FA;
    --card: #fff;
    --text: #333;
    --label: #888;
    --primary: #4A90E2;
    --danger: #E25A5A;
    --success-bg: #E8F5E9;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 16px;
  }
  body.dark {
    --bg: #1a1a1a;
    --card: #2a2a2a;
    --text: #eee;
    --label: #aaa;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --success-bg: #1e3a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
    transition: background 0.3s;
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    font-size: 16px;
    touch-action: manipulation;
  }
  .header {
    padding: 16px;
    background: var(--card);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    border-radius: 0 0 var(--radius) var(--radius);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .date-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .date-nav button { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--primary); padding: 4px 8px; border-radius: 6px; }
  .date-indicator { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #dateDisplayText {
    font-weight: 600;
    font-size: 18px;
    color: var(--text);
    text-decoration: underline dotted;
  }
  .record-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    background: #ccc;
  }
  .wake-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .wake-row label { font-size: 16px; color: var(--label); }
  .yesterday-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--label);
  }
  .yesterday-row input {
    flex: 1;
    min-width: 80px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 500; }
  .btn.outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .btn.warn { background: var(--danger); color: white; }
  .btn.warn.outline { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: var(--card);
    padding: 14px 10px;
    border-radius: var(--radius);
    margin: 0 12px 14px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .stat-item .stat-label { font-size: 13px; color: var(--label); margin-bottom: 4px; }
  .stat-item .stat-value { font-weight: 700; font-size: 17px; }
  .container { padding: 0 12px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    margin-bottom: 16px;
    position: relative;
  }
  .card.night-card { border-left: 4px solid #3F51B5; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-title { font-weight: 700; font-size: 18px; }
  .delete-btn { background: none; border: none; color: var(--danger); font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .field-row { display: flex; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
  .field-label { width: 68px; font-size: 15px; color: var(--label); flex-shrink: 0; }
  .calc-value {
    font-size: 15px;
    color: #2E7D32;
    background: var(--success-bg);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    cursor: pointer;
  }
  .calc-value.editable { text-decoration: underline dotted; }
  .time-btn {
    background: var(--bg);
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .time-btn:active { opacity: 0.7; }
  .time-btn:disabled,
  .disabled .time-btn,
  .disabled .calc-value.editable,
  .disabled .field-input,
  .disabled .nap-sleep-note {
    opacity: 0.5;
    pointer-events: none;
    cursor: not-allowed;
  }
  .disabled .delete-btn { pointer-events: none; opacity: 0.3; }
  .nap-sleep-note {
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    flex: 1;
    min-width: 50px;
    font-family: inherit;
  }
  select.field-input {
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    max-width: 130px;
  }
  .field-input[type="text"] {
    flex: 1;
    min-width: 70px;
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: var(--bg);
    color: var(--text);
  }
  .add-nap-btn {
    width: 100%;
    padding: 16px;
    background: var(--card);
    border: 2px dashed #ccc;
    border-radius: var(--radius);
    font-size: 18px;
    color: var(--primary);
    cursor: pointer;
    margin-bottom: 18px;
    font-weight: 600;
    box-shadow: var(--shadow);
  }
  .night-label { background: #3F51B5; color: white; padding: 2px 8px; border-radius: 12px; font-size: 14px; margin-left: 6px; }
  .mode-toggle { position: fixed; top: 10px; right: 10px; background: var(--card); border: none; font-size: 24px; cursor: pointer; z-index: 11; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  .bottom-tools {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 12px;
  }

  .nowrap-row { flex-wrap: nowrap !important; }
  .nowrap-row .time-btn { padding: 6px 8px; font-size: 14px; }
  .nowrap-row .calc-value { font-size: 14px; padding: 2px 6px; }
  .nowrap-row span { font-size: 14px; white-space: nowrap; }

  .picker-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 200;
  }
  .picker-container {
    background: var(--card); border-radius: 24px; padding: 24px; width: 90%; max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .picker-header { display: flex; justify-content: space-between; margin-bottom: 14px; }
  .picker-header button { background: none; border: none; color: var(--primary); font-size: 18px; cursor: pointer; font-family: inherit; }
  .picker-wheels {
    display: flex; justify-content: center; gap: 12px; height: 200px; position: relative;
    margin-bottom: 12px;
  }
  .wheel-mask {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    background: linear-gradient(to bottom, var(--card) 0%, transparent 30%, transparent 70%, var(--card) 100%);
    z-index: 2;
  }
  .wheel {
    width: 90px; overflow-y: auto; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch; border-radius: 14px;
    background: transparent;
    position: relative; z-index: 1;
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel-highlight {
    position: absolute; top: 50%; left: 0; right: 0; height: 44px; transform: translateY(-50%);
    background: rgba(74,144,226,0.2); border-radius: 12px; pointer-events: none; z-index: 0;
    margin: 0 4px;
  }
  .wheel-item {
    height: 44px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--label); scroll-snap-align: center;
    user-select: none; cursor: pointer;
    position: relative; z-index: 1;
  }
  .picker-preview { text-align: center; font-size: 16px; color: var(--label); min-height: 24px; margin-top: 8px; }

  /* 日历弹窗样式 */
  .cal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 300;
  }
  .cal-container {
    background: var(--card); border-radius: 24px; padding: 20px; width: 90%; max-width: 400px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .cal-header button { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--primary); padding: 4px 8px; }
  .cal-month { font-weight: 700; font-size: 18px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-day-header { font-size: 13px; color: var(--label); padding: 4px 0; }
  .cal-day {
    height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; cursor: pointer; font-size: 14px; position: relative;
  }
  .cal-day:hover { background: var(--bg); }
  .cal-day.today { font-weight: 700; color: var(--primary); }
  .cal-day.other-month { color: var(--label); opacity: 0.4; pointer-events: none; }
  .cal-dot {
    width: 5px; height: 5px; border-radius: 50%; margin-top: 2px;
  }
  .cal-dot.has-data { background: #2E7D32; }
  .cal-dot.no-data { background: #ccc; }

  @media (max-width: 400px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .field-label { width: 60px; }
    .time-btn { padding: 5px 6px; font-size: 14px; }
    .nowrap-row .time-btn { padding: 5px 6px; }
    .calc-value { font-size: 13px; padding: 2px 5px; }
  }
</style>
</head>
<body>
<button class="mode-toggle" onclick="toggleDark()" title="深色模式">🌓</button>

<div class="header">
  <div class="date-row">
    <div class="date-nav">
      <button onclick="changeDate(-1)">◀</button>
      <div class="date-indicator" onclick="openCalendar()">
        <span id="dateDisplayText">2026-07-14</span>
        <span class="record-dot" id="recordDot"></span>
      </div>
      <button onclick="changeDate(1)">▶</button>
    </div>
    <div id="todayIndicator" style="font-size:13px;color:var(--primary)"></div>
  </div>
  <div class="wake-row">
    <label>起床时间:</label>
    <button class="time-btn" id="wakeTimeBtn" onclick="if(!locked)openWakeTimePicker()">07:00</button>
    <button class="btn outline" onclick="copyYesterday()" id="copyBtn">复制昨日</button>
    <button class="btn outline" id="lockToggleBtn" onclick="toggleLock()" style="display:none;">🔓 解锁编辑</button>
  </div>
  <div class="yesterday-row" id="yesterdayRow">
    <span>昨夜入睡 <strong id="yesterdayAsleep">--:--</strong></span>
    <input type="text" placeholder="昨夜备注" id="yesterdayNoteInput" onchange="onYesterdayNoteChange()">
  </div>
</div>

<div class="stats">
  <div class="stat-item"><div class="stat-label">已清醒</div><div class="stat-value" id="statAwake">--</div></div>
  <div class="stat-item"><div class="stat-label">白天睡眠</div><div class="stat-value" id="statDaySleep">--</div></div>
  <div class="stat-item"><div class="stat-label">夜间睡眠</div><div class="stat-value" id="statNightSleep">--</div></div>
  <div class="stat-item"><div class="stat-label">总睡眠</div><div class="stat-value" id="statTotalSleep">--</div></div>
</div>

<div class="container" id="mainContent">
  <div id="napsContainer"></div>
  <button class="add-nap-btn" id="addNapBtn" onclick="addNap()">+ 添加小觉</button>
  <div id="nightCardContainer"></div>
</div>

<div class="bottom-tools">
  <button class="btn outline" onclick="exportData()">导出数据</button>
  <button class="btn outline" onclick="importData()">导入数据</button>
</div>

<!-- 时间选择器 -->
<div id="timePickerOverlay" class="picker-overlay" style="display:none;">
  <div class="picker-container">
    <div class="picker-header">
      <button onclick="cancelPicker()">取消</button>
      <span style="font-weight:600;font-size:18px;">选择时间</span>
      <button onclick="confirmPicker()">确定</button>
    </div>
    <div class="picker-wheels" id="pickerWheels">
      <div class="wheel-mask"></div>
      <div class="wheel-highlight"></div>
      <div class="wheel" id="hourWheel"></div>
      <div class="wheel" id="minuteWheel"></div>
    </div>
    <div class="picker-preview" id="pickerPreview"></div>
  </div>
</div>

<!-- 时长选择器 -->
<div id="durationPickerOverlay" class="picker-overlay" style="display:none;">
  <div class="picker-container">
    <div class="picker-header">
      <button onclick="cancelDurationPicker()">取消</button>
      <span style="font-weight:600;font-size:18px;">选择时长</span>
      <button onclick="confirmDurationPicker()">确定</button>
    </div>
    <div class="picker-wheels" id="durationWheels">
      <div class="wheel-mask"></div>
      <div class="wheel-highlight"></div>
      <div class="wheel" id="durHourWheel"></div>
      <div class="wheel" id="durMinuteWheel"></div>
    </div>
    <div class="picker-preview" id="durationPreview"></div>
  </div>
</div>

<!-- 自定义日历弹窗 -->
<div id="calendarOverlay" class="cal-overlay" style="display:none;" onclick="if(event.target===this)closeCalendar()">
  <div class="cal-container">
    <div class="cal-header">
      <button onclick="changeCalMonth(-1)">◀</button>
      <span class="cal-month" id="calMonthLabel"></span>
      <button onclick="changeCalMonth(1)">▶</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>

<script>
// ==================== 数据库 ====================
const DB_NAME = 'BabySleepDB8', STORE_NAME = 'records';
let db, currentDate = getTodayLocal(), currentData = null;
let scrollPosition = 0;
let locked = false;
// 日历状态
let calYear, calMonth;

function getTodayLocal() { return getLocalDateString(new Date()); }
function getLocalDateString(date) {
  const d = date instanceof Date ? date : new Date(date + 'T00:00:00');
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function shiftDate(dateStr, delta) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return getLocalDateString(d);
}

function openDB() {
  return new Promise((resolve, reject) => {
    let req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => { e.target.result.createObjectStore(STORE_NAME, { keyPath: 'date' }); };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror = reject;
  });
}
async function loadRecord(date) {
  return new Promise(resolve => {
    let tx = db.transaction(STORE_NAME,'readonly');
    let r = tx.objectStore(STORE_NAME).get(date);
    r.onsuccess = () => resolve(r.result||null);
    r.onerror = () => resolve(null);
  });
}
async function saveRecord(record) {
  return new Promise(resolve => {
    let tx = db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(record);
    tx.oncomplete = resolve;
  });
}
function createEmptyRecord(date) {
  return { date, wake_up_time:'07:00', naps:[], night:{ bed_time:'19:30',asleep_time:'19:40',wake_time:'07:15',sleep_method:'自主',wake_method:'自己醒',note:'' } };
}

const toMin = t => { if(!t) return NaN; let [h,m]=t.split(':').map(Number); return h*60+m; };
const toTime = min => { min=((min%1440)+1440)%1440; return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`; };
const duration = (s,e) => { if(!s||!e) return null; let sm=toMin(s),em=toMin(e); if(em<=sm) em+=1440; return em-sm; };
const fmtDur = m => m===null||isNaN(m)?'--':`${Math.floor(m/60)}h${m%60}m`;
const fmtDurShort = m => m===null||isNaN(m)?'--':`${Math.floor(m/60)}h${m%60}m`;
const fmtMinOnly = m => m===null||isNaN(m)?'--':`${m}分钟`;

function isLocked() { return locked; }
function toggleLock() { locked = !locked; updateLockUI(); }

function updateLockUI() {
  const main = document.getElementById('mainContent');
  const lockBtn = document.getElementById('lockToggleBtn');
  const wakeBtn = document.getElementById('wakeTimeBtn');
  const copyBtn = document.getElementById('copyBtn');
  if (locked) {
    main.classList.add('disabled');
    lockBtn.textContent = '🔒 锁定编辑';
    lockBtn.className = 'btn';
    wakeBtn.disabled = true;
    if (copyBtn) copyBtn.style.display = 'none';
  } else {
    main.classList.remove('disabled');
    lockBtn.textContent = '🔓 解锁编辑';
    lockBtn.className = 'btn outline';
    wakeBtn.disabled = false;
    if (copyBtn) copyBtn.style.display = '';
  }
}

function autoLock() {
  const today = getTodayLocal();
  const showLockBtn = currentDate < today;
  document.getElementById('lockToggleBtn').style.display = showLockBtn ? '' : 'none';
  locked = showLockBtn;
  updateLockUI();
}

async function setNextDayWakeUp(todayDate, wakeTime) {
  if (!wakeTime) return;
  const nextDate = shiftDate(todayDate, 1);
  let nextRecord = await loadRecord(nextDate);
  if (!nextRecord) nextRecord = createEmptyRecord(nextDate);
  if (!nextRecord.wake_up_time || nextRecord.wake_up_time === '07:00') {
    nextRecord.wake_up_time = wakeTime;
    await saveRecord(nextRecord);
  }
}

async function setPreviousNightWake(todayDate, wakeTime) {
  if (!wakeTime) return;
  const prevDate = shiftDate(todayDate, -1);
  let prevRecord = await loadRecord(prevDate);
  if (!prevRecord) return;
  prevRecord.night.wake_time = wakeTime;
  await saveRecord(prevRecord);
}

function propagate(rec) {
  let naps = rec.naps;
  for (let i = 0; i < naps.length; i++) {
    const nap = naps[i];
    if (nap.planned_wake_window != null) {
      const base = i === 0 ? rec.wake_up_time : naps[i-1].wake_time;
      if (base && base !== '--:--') {
        const newAsleep = toTime(toMin(base) + nap.planned_wake_window);
        nap.asleep_time = newAsleep;
        if (!nap.bed_manual) nap.bed_time = toTime(toMin(newAsleep) - 10);
      }
    }
  }
  if (rec.night.planned_wake_window != null) {
    const base = naps.length ? naps[naps.length-1].wake_time : rec.wake_up_time;
    if (base && base !== '--:--') {
      const newAsleep = toTime(toMin(base) + rec.night.planned_wake_window);
      rec.night.asleep_time = newAsleep;
      if (!rec.night.bed_manual) rec.night.bed_time = toTime(toMin(newAsleep) - 10);
    }
  }
}

function computeAll(rec) {
  let naps = rec.naps, wake = rec.wake_up_time, night = rec.night;
  naps.forEach((nap,i)=>{
    nap.sleep_duration = duration(nap.asleep_time, nap.wake_time);
    nap.wake_window = i===0 ? duration(wake, nap.asleep_time) : duration(naps[i-1].wake_time, nap.asleep_time);
    const bedBase = i===0 ? wake : naps[i-1].wake_time;
    nap.bed_interval = duration(bedBase, nap.bed_time);
  });
  night.sleep_duration = duration(night.asleep_time, night.wake_time);
  night.before_night_window = naps.length ? duration(naps[naps.length-1].wake_time, night.asleep_time) : duration(wake, night.asleep_time);
  const nightBedBase = naps.length ? naps[naps.length-1].wake_time : wake;
  night.bed_interval = duration(nightBedBase, night.bed_time);
}

function computeStats(rec) {
  let dayTotal=0; rec.naps.forEach(n=>{ if(n.sleep_duration) dayTotal+=n.sleep_duration; });
  let nightTotal = rec.night.sleep_duration || 0;
  let total = dayTotal+nightTotal;
  let awakeSum = 0;
  rec.naps.forEach(n=>{ if(n.wake_window) awakeSum += n.wake_window; });
  return { awakeDur: awakeSum, dayTotal, nightTotal, total };
}

async function updateDateDisplay() {
  document.getElementById('dateDisplayText').textContent = currentDate;
  // 更新圆点
  const dot = document.getElementById('recordDot');
  if (currentData && currentData.naps && (currentData.naps.length > 0 || currentData.night.asleep_time !== '19:40')) {
    dot.style.background = '#2E7D32';
  } else {
    dot.style.background = '#ccc';
  }
}

async function loadYesterdayInfo() {
  const yesterday = shiftDate(currentDate, -1);
  const rec = await loadRecord(yesterday);
  const asleepEl = document.getElementById('yesterdayAsleep');
  const noteInput = document.getElementById('yesterdayNoteInput');
  if (rec && rec.night && rec.night.asleep_time) {
    asleepEl.textContent = rec.night.asleep_time;
  } else {
    asleepEl.textContent = '--:--';
  }
  if (rec && rec.night) {
    noteInput.value = rec.night.note || '';
  } else {
    noteInput.value = '';
  }
}

async function onYesterdayNoteChange() {
  const note = document.getElementById('yesterdayNoteInput').value;
  const yesterday = shiftDate(currentDate, -1);
  let rec = await loadRecord(yesterday);
  if (!rec) {
    rec = createEmptyRecord(yesterday);
  }
  rec.night.note = note;
  await saveRecord(rec);
}

// ==================== 自定义日历 ====================
async function openCalendar() {
  // 以当前日期的年月初始化
  const d = new Date(currentDate + 'T00:00:00');
  calYear = d.getFullYear();
  calMonth = d.getMonth() + 1;
  await renderCalendar();
  document.getElementById('calendarOverlay').style.display = 'flex';
}

function closeCalendar() {
  document.getElementById('calendarOverlay').style.display = 'none';
}

async function changeCalMonth(delta) {
  calMonth += delta;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  if (calMonth < 1) { calMonth = 12; calYear--; }
  await renderCalendar();
}

async function renderCalendar() {
  const monthLabel = document.getElementById('calMonthLabel');
  monthLabel.textContent = `${calYear}年 ${calMonth}月`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // 表头
  const headers = ['一','二','三','四','五','六','日'];
  headers.forEach(h => {
    const div = document.createElement('div');
    div.className = 'cal-day-header';
    div.textContent = h;
    grid.appendChild(div);
  });

  // 获取有数据的日期集合
  const tx = db.transaction(STORE_NAME, 'readonly');
  const allRecords = await new Promise(resolve => {
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
  });
  const dataDates = new Set(allRecords.filter(r => {
    // 判断是否有真实数据：存在小觉或夜觉有自定义时间
    return r.naps && (r.naps.length > 0 || r.night.asleep_time !== '19:40');
  }).map(r => r.date));

  // 当月第一天
  const firstDay = new Date(calYear, calMonth-1, 1);
  const startDayOfWeek = firstDay.getDay(); // 0=日, 1=一...6=六
  // 调整为周一=0
  const startOffset = (startDayOfWeek === 0) ? 6 : startDayOfWeek - 1;
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const todayStr = getTodayLocal();

  // 填充前面的空白
  for (let i = 0; i < startOffset; i++) {
    const div = document.createElement('div');
    div.className = 'cal-day other-month';
    div.textContent = '';
    grid.appendChild(div);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const div = document.createElement('div');
    div.className = 'cal-day';
    div.textContent = day;
    if (dateStr === todayStr) div.classList.add('today');
    if (dateStr === currentDate) div.style.background = 'var(--primary)'; div.style.color = 'white';
    const dot = document.createElement('span');
    dot.className = 'cal-dot ' + (dataDates.has(dateStr) ? 'has-data' : 'no-data');
    div.appendChild(dot);
    div.onclick = () => {
      if (dateStr === currentDate) { closeCalendar(); return; }
      jumpToDate(dateStr);
      closeCalendar();
    };
    grid.appendChild(div);
  }
}

function renderAll() {
  computeAll(currentData);
  let stats = computeStats(currentData);
  document.getElementById('statAwake').textContent = stats.awakeDur !== null ? fmtDurShort(stats.awakeDur) : '--';
  document.getElementById('statDaySleep').textContent = fmtDurShort(stats.dayTotal);
  document.getElementById('statNightSleep').textContent = fmtDurShort(stats.nightTotal);
  document.getElementById('statTotalSleep').textContent = fmtDurShort(stats.total);
  document.getElementById('wakeTimeBtn').textContent = currentData.wake_up_time;
  document.getElementById('todayIndicator').textContent = currentData.date === getTodayLocal() ? '今天' : '';
  renderNaps();
  renderNight();
  updateDateDisplay();
}

// ==================== 时长选择器 ====================
let durationCallback = null;

function showDurationPicker(currentMinutes, callback) {
  durationCallback = callback;
  const overlay = document.getElementById('durationPickerOverlay');
  overlay.style.display = 'flex';
  const h = Math.floor(currentMinutes / 60);
  const m = currentMinutes % 60;
  buildLoopWheel('durHourWheel', 0, 12, h);
  buildLoopWheel('durMinuteWheel', 0, 59, m, 1);
  document.getElementById('durationPreview').textContent = '';
}

function cancelDurationPicker() {
  document.getElementById('durationPickerOverlay').style.display = 'none';
  durationCallback = null;
}

function confirmDurationPicker() {
  const hWheel = document.getElementById('durHourWheel');
  const mWheel = document.getElementById('durMinuteWheel');
  const getVal = (wheel) => {
    let center = wheel.scrollTop + wheel.clientHeight/2;
    let best = null, minDist = Infinity;
    [...wheel.children].forEach(el => {
      let elCenter = el.offsetTop + el.offsetHeight/2;
      let dist = Math.abs(center - elCenter);
      if(dist < minDist) { minDist = dist; best = el; }
    });
    return best ? parseInt(best.dataset.value) : 0;
  };
  const hours = getVal(hWheel);
  const minutes = getVal(mWheel);
  const total = hours * 60 + minutes;
  if (durationCallback) durationCallback(total);
  cancelDurationPicker();
}

function editWakeWindow(idx) {
  const nap = currentData.naps[idx];
  const cur = nap.wake_window || nap.planned_wake_window || 90;
  showDurationPicker(cur, (newWindowMin) => {
    let base = idx===0 ? currentData.wake_up_time : currentData.naps[idx-1].wake_time;
    if(!base) return alert('缺少基准时间');
    const newAsleep = toTime(toMin(base) + newWindowMin);
    const oldDuration = duration(nap.asleep_time, nap.wake_time);
    nap.asleep_time = newAsleep;
    if (nap.wake_time && oldDuration !== null) nap.wake_time = toTime(toMin(newAsleep) + oldDuration);
    if (!nap.bed_manual) nap.bed_time = toTime(toMin(newAsleep) - 10);
    nap.planned_wake_window = newWindowMin;
    nap.bed_manual = nap.bed_manual || false;
    propagate(currentData);
    saveAndRender();
  });
}

function editNightWindow() {
  const night = currentData.night;
  const cur = night.before_night_window || night.planned_wake_window || 120;
  showDurationPicker(cur, (newWindowMin) => {
    let base = currentData.naps.length ? currentData.naps[currentData.naps.length-1].wake_time : currentData.wake_up_time;
    if(!base) return alert('缺少基准时间');
    const newAsleep = toTime(toMin(base) + newWindowMin);
    const oldDuration = duration(night.asleep_time, night.wake_time);
    night.asleep_time = newAsleep;
    if (night.wake_time && oldDuration !== null) night.wake_time = toTime(toMin(newAsleep) + oldDuration);
    if (!night.bed_manual) night.bed_time = toTime(toMin(newAsleep) - 10);
    night.planned_wake_window = newWindowMin;
    night.bed_manual = night.bed_manual || false;
    propagate(currentData);
    saveAndRender();
  });
}

function editSleepDuration(idx) {

function editNightDuration() {

// ==================== 时间点选择器 ====================
let currentPicker = null;
function openTimePicker(type, napIdx) {
  if (isLocked()) return;
  let def;
  if(type.startsWith('nap')) {
    let nap = currentData.naps[napIdx];
    if(type==='napBed') def = nap.bed_time;
    else if(type==='napAsleep') def = nap.asleep_time;
    else def = nap.wake_time;
  } else if(type.startsWith('night')) {
    if(type==='nightBed') def = currentData.night.bed_time;
    else if(type==='nightAsleep') def = currentData.night.asleep_time;
    else def = currentData.night.wake_time;
  } else if(type==='wake') def = currentData.wake_up_time;
  if(!def || def==='--:--') {
    let now = new Date();
    def = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  }
  currentPicker = { type, napIdx, def, onChange: async (val) => {
    if(type==='wake') {
      currentData.wake_up_time = val;
      await setPreviousNightWake(currentData.date, val);
      propagate(currentData);
    } else if(type.startsWith('nap')) {
      let nap = currentData.naps[napIdx];
      if(type==='napBed') { nap.bed_time = val; nap.bed_manual = true; delete nap.planned_wake_window; }
      else if(type==='napAsleep') { nap.asleep_time = val; if(!nap.bed_manual) nap.bed_time = toTime(toMin(val)-10); delete nap.planned_wake_window; }
      else if(type==='napWake') { nap.wake_time = val; }
    } else if(type.startsWith('night')) {
      if(type==='nightBed') { currentData.night.bed_time = val; currentData.night.bed_manual = true; delete currentData.night.planned_wake_window; }
      else if(type==='nightAsleep') { currentData.night.asleep_time = val; if(!currentData.night.bed_manual) currentData.night.bed_time = toTime(toMin(val)-10); delete currentData.night.planned_wake_window; }
      else if(type==='nightWake') { currentData.night.wake_time = val; await setNextDayWakeUp(currentData.date, val); }
    }
    propagate(currentData);
    saveAndRender();
  }};
  showPicker(def);
}

function showPicker(initial) {
  let overlay = document.getElementById('timePickerOverlay');
  overlay.style.display = 'flex';
  let [h,m] = initial.split(':').map(Number);
  buildLoopWheel('hourWheel', 0, 23, h);
  buildLoopWheel('minuteWheel', 0, 59, m, 1);
  updatePickerPreview();
}

function buildLoopWheel(id, min, max, selected, step=1) {
  let wheel = document.getElementById(id);
  wheel.innerHTML = '';
  const data = [];
  for(let r=0; r<3; r++) for(let i=min; i<=max; i+=step) data.push(i);
  const middleStart = data.length/3;
  data.forEach((val, idx)=>{
    let div = document.createElement('div');
    div.className = 'wheel-item';
    div.textContent = String(val).padStart(2,'0');
    div.dataset.value = val;
    wheel.appendChild(div);
  });
  let targetIdx = middleStart + (selected - min) / step;
  let targetItem = wheel.children[targetIdx];
  if(targetItem) wheel.scrollTop = targetItem.offsetTop - wheel.clientHeight/2 + targetItem.offsetHeight/2;
  wheel.onscroll = () => {
    let center = wheel.scrollTop + wheel.clientHeight/2;
    let best = null, minDist = Infinity;
    [...wheel.children].forEach(el => {
      let elCenter = el.offsetTop + el.offsetHeight/2;
      let dist = Math.abs(center - elCenter);
      if(dist < minDist) { minDist = dist; best = el; }
    });
    if(best) {
      [...wheel.children].forEach(el => { el.style.color = 'var(--label)'; el.style.fontWeight = '400'; });
      best.style.color = 'var(--text)'; best.style.fontWeight = '600';
    }
    updatePickerPreview();
  };
}

function getPickerValue() {
  let hWheel = document.getElementById('hourWheel');
  let mWheel = document.getElementById('minuteWheel');
  let getCenterVal = (wheel) => {
    let center = wheel.scrollTop + wheel.clientHeight/2;
    let best = null, minDist = Infinity;
    [...wheel.children].forEach(el => {
      let elCenter = el.offsetTop + el.offsetHeight/2;
      let dist = Math.abs(center - elCenter);
      if(dist < minDist) { minDist = dist; best = el; }
    });
    return best ? best.dataset.value : null;
  };
  let h = getCenterVal(hWheel); let m = getCenterVal(mWheel);
  if(!h || !m) return null;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function updatePickerPreview() {
  let val = getPickerValue();
  if(!val || !currentPicker) return;
  let preview = document.getElementById('pickerPreview');
  let type = currentPicker.type, idx = currentPicker.napIdx;
  if(type==='napBed' || type==='nightBed') {
    let asleep = type==='napBed' ? currentData.naps[idx].asleep_time : currentData.night.asleep_time;
    preview.textContent = asleep ? `入睡耗时 ${duration(val, asleep)}分钟` : '(缺入睡时间)';
  } else if(type==='napAsleep') {
    let prev = idx===0 ? currentData.wake_up_time : currentData.naps[idx-1].wake_time;
    if(prev) { let w = duration(prev, val); preview.textContent = w ? `清醒间隔 ${fmtDur(w)}` : ''; }
    else preview.textContent = '';
  } else if(type==='nightAsleep') {
    let last = currentData.naps.length ? currentData.naps[currentData.naps.length-1].wake_time : currentData.wake_up_time;
    if(last) { let w = duration(last, val); preview.textContent = w ? `清醒间隔 ${fmtDur(w)}` : ''; }
    else preview.textContent = '';
  } else preview.textContent = '';
}

function confirmPicker() { let val = getPickerValue(); if(val && currentPicker) currentPicker.onChange(val); cancelPicker(); }
function cancelPicker() { document.getElementById('timePickerOverlay').style.display = 'none'; currentPicker = null; }
function openWakeTimePicker() { if(!isLocked()) openTimePicker('wake'); }

function addNap() { if(isLocked()) return; currentData.naps.push({ bed_time:'', asleep_time:'', wake_time:'', sleep_method:'自主', wake_method:'自己醒', note:'', sleep_note:'' }); saveAndRender(); }
function deleteNap(idx) { if(isLocked()) return; if(!confirm('删除第'+(idx+1)+'觉？')) return; currentData.naps.splice(idx,1); propagate(currentData); saveAndRender(); }
function saveAndRender() { computeAll(currentData); saveRecord(currentData); renderAll(); }

async function changeDate(delta) {
  scrollPosition = window.scrollY;
  currentDate = shiftDate(currentDate, delta);
  autoLock();
  await loadCurrentDate();
  await loadYesterdayInfo();
}
async function jumpToDate(dateStr) {
  if (!dateStr) return;
  scrollPosition = 0;
  currentDate = dateStr;
  autoLock();
  await loadCurrentDate();
  await loadYesterdayInfo();
}
async function loadCurrentDate() {
  let rec = await loadRecord(currentDate);
  if(!rec) {
    let prev = await loadRecord(shiftDate(currentDate, -1));
    rec = createEmptyRecord(currentDate);
    if(prev && prev.naps.length) rec.naps = prev.naps.map(()=>({ bed_time:'',asleep_time:'',wake_time:'',sleep_method:'',wake_method:'',note:'',sleep_note:'' }));
    await saveRecord(rec);
  }
  currentData = rec;
  propagate(currentData);
  renderAll();
  requestAnimationFrame(() => { window.scrollTo(0, scrollPosition); });
}
async function copyYesterday() {
  let yesterday = shiftDate(currentDate, -1);
  let rec = await loadRecord(yesterday);
  if(!rec) return alert('昨天无数据');
  if(!confirm(`复制昨天 (${yesterday}) 的所有记录到今天？今日数据将被覆盖。`)) return;
  let copy = JSON.parse(JSON.stringify(rec));
  copy.date = currentDate;
  copy.naps.forEach(n => { n.note = ''; n.sleep_note = ''; });
  copy.night.note = ''; copy.night.sleep_note = '';
  if (!currentData || !currentData.wake_up_time || currentData.wake_up_time === '07:00') {
    if (copy.night && copy.night.wake_time) copy.wake_up_time = copy.night.wake_time;
  } else {
    copy.wake_up_time = currentData.wake_up_time;
  }
  copy.naps.forEach(nap => { nap.planned_wake_window = nap.wake_window || null; nap.bed_time = ''; nap.asleep_time = ''; nap.wake_time = ''; delete nap.sleep_duration; delete nap.bed_manual; });
  copy.night.planned_wake_window = copy.night.before_night_window || null;
  copy.night.bed_time = ''; copy.night.asleep_time = ''; copy.night.wake_time = '';
  delete copy.night.sleep_duration; delete copy.night.bed_manual;
  currentData = copy;
  propagate(currentData);
  await saveRecord(currentData);
  renderAll();
}

function exportData() {
  let tx = db.transaction(STORE_NAME,'readonly'); let all = tx.objectStore(STORE_NAME).getAll();
  all.onsuccess = ()=>{
    let json = JSON.stringify(all.result,null,2); let blob = new Blob([json],{type:'application/json'});
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `宝宝睡眠备份_${getTodayLocal()}.json`; a.click();
  };
}
function importData() {
  let inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = async e=>{
    let file = e.target.files[0]; if(!file) return;
    let text = await file.text(); let records; try{ records=JSON.parse(text); }catch{ return alert('格式错误'); }
    let tx = db.transaction(STORE_NAME,'readwrite'); let store = tx.objectStore(STORE_NAME);
    records.forEach(r=>store.put(r)); tx.oncomplete = ()=>{ loadCurrentDate(); alert('导入成功'); };
  }; inp.click();
}

function toggleDark() { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark')); }

(async ()=>{
  await openDB();
  if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark');
  autoLock();
  await loadCurrentDate();
  await loadYesterdayInfo();
})();
</script>
